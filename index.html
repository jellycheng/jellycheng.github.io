<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jelly Cheng 的个人主页">
  <title>Jelly · 欢迎访问我的页面</title>
  <style>
    :root {
      --ink: #16353f;
      --ink-soft: #3d5c66;
      --foam: #e8f6f4;
      --sea: #1f8a7a;
      --sea-deep: #0f5c52;
      --coral: #e07a5f;
      --mist: rgba(255, 255, 255, 0.55);
      --glow-a: #7ec8c0;
      --glow-b: #f2c6a0;
      --glow-c: #9ec9e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #d9f1ee 0%, #f7efe6 48%, #dceaf5 100%);
      overflow-x: hidden;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(2rem, 6vw, 4rem);
      isolation: isolate;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(48px);
      opacity: 0.55;
      z-index: -1;
      animation: drift 14s ease-in-out infinite;
    }

    .blob-a {
      width: min(52vw, 420px);
      height: min(52vw, 420px);
      background: var(--glow-a);
      top: -8%;
      left: -6%;
    }

    .blob-b {
      width: min(46vw, 380px);
      height: min(46vw, 380px);
      background: var(--glow-b);
      bottom: -10%;
      right: -4%;
      animation-delay: -4s;
    }

    .blob-c {
      width: min(34vw, 280px);
      height: min(34vw, 280px);
      background: var(--glow-c);
      top: 42%;
      left: 58%;
      animation-delay: -8s;
    }

    .ripple {
      position: absolute;
      inset: 12% 8%;
      z-index: -1;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.45), transparent 42%),
        radial-gradient(circle at 78% 68%, rgba(255, 255, 255, 0.35), transparent 38%);
      pointer-events: none;
    }

    .hero {
      width: min(100%, 720px);
      text-align: center;
      animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      font-family: "Songti SC", "STSong", "SimSun", "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      font-size: clamp(3.4rem, 12vw, 6.5rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 0.95;
      color: var(--sea-deep);
      margin-bottom: 1.1rem;
    }

    .brand em {
      font-style: italic;
      color: var(--sea);
    }

    .headline {
      font-size: clamp(1.35rem, 3.4vw, 1.85rem);
      font-weight: 500;
      letter-spacing: 0.04em;
      margin-bottom: 0.75rem;
    }

    .lead {
      font-size: 1.05rem;
      color: var(--ink-soft);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      justify-content: center;
      align-items: center;
    }

    .cta {
      appearance: none;
      border: none;
      background: var(--sea);
      color: #fff;
      font: inherit;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.9rem 1.45rem;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 220ms ease, background 220ms ease;
    }

    .cta:hover,
    .cta:focus-visible {
      background: var(--sea-deep);
      transform: translateY(-2px);
      outline: none;
    }

    .cta:active {
      transform: translateY(0);
    }

    .visual {
      position: absolute;
      inset: auto 0 0 0;
      height: min(38vh, 320px);
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      left: -5%;
      width: 110%;
      height: 180%;
      opacity: 0.55;
      animation: swell 10s ease-in-out infinite;
    }

    .wave path {
      fill: none;
      stroke: rgba(15, 92, 82, 0.18);
      stroke-width: 2;
    }

    .wave-2 {
      animation-delay: -3.5s;
      opacity: 0.35;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 3.5rem;
      transform: translateX(-50%) translateY(-120%);
      background: var(--ink);
      color: #fff;
      padding: 0.7rem 1.1rem;
      border-radius: 10px;
      font-size: 0.92rem;
      opacity: 0;
      transition: transform 280ms ease, opacity 280ms ease;
      z-index: 20;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(28px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, -22px) scale(1.06); }
    }

    @keyframes swell {
      0%, 100% { transform: translateX(0) translateY(8px); }
      50% { transform: translateX(-2%) translateY(-6px); }
    }

    @media (max-width: 560px) {
      .actions {
        flex-direction: column;
      }

      .cta {
        width: 100%;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob,
      .wave,
      .hero {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="blob blob-a" aria-hidden="true"></div>
    <div class="blob blob-b" aria-hidden="true"></div>
    <div class="blob blob-c" aria-hidden="true"></div>
    <div class="ripple" aria-hidden="true"></div>

    <section class="hero">
      <p class="brand">Jelly<em>.</em></p>
      <h1 class="headline">欢迎访问我的页面</h1>
      <p class="lead">这里是 Jelly Cheng 的个人小站，欢迎交流。</p>
      <div class="actions">
        <button class="cta" type="button" id="copyQq" data-qq="42282367">复制 QQ：42282367</button>
      </div>
    </section>

    <div class="visual" aria-hidden="true">
      <svg class="wave" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path d="M0,160 C240,220 360,80 600,140 C840,200 960,80 1200,140 C1320,170 1380,180 1440,160"></path>
        <path d="M0,200 C220,150 420,250 680,190 C940,130 1120,220 1440,180"></path>
      </svg>
      <svg class="wave wave-2" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path d="M0,180 C260,120 480,240 740,170 C1000,100 1220,210 1440,150"></path>
      </svg>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">已复制 QQ 号</div>

  <script>
    (function () {
      var button = document.getElementById("copyQq");
      var toast = document.getElementById("toast");
      var timer;

      button.addEventListener("click", function () {
        var qq = button.getAttribute("data-qq");
        var show = function () {
          toast.classList.add("show");
          clearTimeout(timer);
          timer = setTimeout(function () {
            toast.classList.remove("show");
          }, 1800);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(qq).then(show).catch(function () {
            fallbackCopy(qq);
            show();
          });
        } else {
          fallbackCopy(qq);
          show();
        }
      });

      function fallbackCopy(text) {
        var area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "absolute";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        document.body.removeChild(area);
      }
    })();
  </script>
</body>
</html>
